[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deptrial"
version = "1.0.0"
description = "50 validated supply-chain dependency skills plus a manifest trust scanner with stable rule ids."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["supply-chain", "dependency-confusion", "typosquat", "lockfile", "skills"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deptrial = "deptrial.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
