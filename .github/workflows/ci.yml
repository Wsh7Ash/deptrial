name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate corpus
        run: deptrial validate
      - name: Build artifacts and fail on drift
        run: deptrial build && git diff --exit-code
      - name: Scan the fixture trees
        run: |
          deptrial scan examples/hardened --fail-on high
          deptrial scan examples/vulnerable --fail-on high --json \
            --internal-prefix '@acme/' --allowlist express --allowlist lodash \
            > findings.json || true
          jq -e '.counts.high == 7' findings.json
      - name: Test
        run: python -m pytest -q
